<!-- 
HTML COMMENTS & STRUCTURE STUDY GUIDE:

<!doctype html>
- Explanation: The very first line of code that tells the web browser, "Hey, I am using the newest version of HTML5!"
- Example: Like putting "MLA Format" at the top of an English essay so the teacher knows exactly how to read it.

<html>
- Explanation: The giant wrapper that holds absolutely everything on your entire webpage, and the "lang" part tells the computer it is in English.
- Example: Like the physical folder that holds all of your science project papers together.

<head>
- Explanation: The hidden brain of the webpage that holds behind-the-scenes settings and the page title.
- Example: Information you don't see on the screen, but the computer needs it to load the site properly.

<meta>
- Explanation: Provides invisible background settings to the browser, like how to read special characters or how to fit the page on a phone screen.
- Example: The setting that makes sure the webpage shrinks down perfectly to fit on your smartphone.

<title>
- Explanation: The text that shows up at the very top of your web browser's tab.
- Example: The words "HTML Comments: Research Edition" hovering in the tab next to the little "x" you click to close the page.


<body>
- Explanation: The main display area that holds everything the user will actually see and read on the screen.
- Example: All the text, headings, and paragraphs that make up the visual website.

<h1>
- Explanation: The biggest and most important heading on your page, usually used just once for the main title.
- Example: The giant "Quantum Machine Learning (QML) Project" text at the top of the page.

<h2>
- Explanation: A slightly smaller sub-heading used to divide your page into neat, readable chapters or sections.
- Example: The "Space Weather AI Framework" title right above the second section.

<p>
- Explanation: Stands for "paragraph" and holds all your regular, everyday sentences and text blocks.
- Example: The sentence "All current modules are running efficiently."

-->

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width" />
    <title>HTML Comments: Research Edition</title>

    <!-- 
    Comments in HTML are written between these tags: < ! - - and - - >
    They are ignored by the browser and won't show up on the webpage.
    They are perfect for leaving notes for yourself or your research collaborators.
  --></head>
  <body>
    <h1>Quantum Machine Learning (QML) Project</h1>

    <!-- This is a single-line comment explaining the paragraph below -->
    <p>Currently optimizing 5-qubit variational quantum circuits.</p>

    <!-- 
    This is a multi-line comment.
    Useful for leaving detailed task lists.
    TODO: 
    1. Run overnight GPU batches on the MacBook Pro M1.
    2. Format the output tables in LaTeX for the upcoming journal submission.
    3. Discuss the hybrid CNN-QNN architecture with Abhay and Shreyansh.
  -->

    <h2>Space Weather AI Framework</h2>
    <p>
      Initializing the MSTML-CMEP model for Coronal Mass Ejection forecasting.
    </p>

    <!-- You can also use comments to temporarily hide code (commenting out) while debugging: -->

    <!--
  <p>This paragraph contains an outdated C++ algorithm that we replaced.</p>
  <p>Time complexity was O(n^3), which was too slow for our LEO space debris analysis.</p>
  -->

    <p>All current modules are running efficiently.</p>
  </body>
</html>
